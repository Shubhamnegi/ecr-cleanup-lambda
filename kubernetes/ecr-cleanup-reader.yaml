apiVersion: v1
kind: Namespace
metadata:
  name: ecr-cleanup
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-cleanup-reader
  namespace: ecr-cleanup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ecr-cleanup-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ecr-cleanup-pod-reader
subjects:
  - kind: ServiceAccount
    name: ecr-cleanup-reader
    namespace: ecr-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ecr-cleanup-pod-reader
